name: Tested on a known-unstable setting
description: You ran steadycheck on a setting you know is unstable (overclock, tight timings, low voltage). PASS and FAIL both help.
title: "[unstable setting] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. How to run and what to paste: [testing guide](https://github.com/kimjione1206/steadycheck/blob/main/docs/TESTING.md) ([한국어](https://github.com/kimjione1206/steadycheck/blob/main/docs/TESTING.ko.md)).
        For a memory overclock please run the `mem` command (not `all`), so the time to the first error is measured from the start of the memory test.
        **Do not paste personal data:** no serial numbers, names, user or computer names, IP addresses or product keys. `tools/collect-info.ps1` leaves these out, and the steadycheck result JSON contains no personal data.
  - type: input
    id: version
    attributes:
      label: steadycheck version
      description: The `version` field of the result JSON, e.g. 0.6.0.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: steadycheck mem --mb auto --seconds 600 --require-complete --keep-going 20
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Paste the output of `tools/collect-info.ps1`.
    validations:
      required: true
  - type: dropdown
    id: memory-type
    attributes:
      label: Memory type
      description: The "Memory type" line printed by `tools/collect-info.ps1`. LPDDR4, LPDDR5 and DDR3 count as Other.
      options:
        - DDR4
        - DDR5
        - Other
        - Don't know
    validations:
      required: true
  - type: input
    id: memory-speed
    attributes:
      label: Memory speed (MT/s)
      description: The speed you set, e.g. 6400 for DDR5-6400.
      placeholder: "6400"
    validations:
      required: true
  - type: input
    id: timings
    attributes:
      label: Primary timings (optional)
      description: tCL-tRCD-tRP-tRAS.
      placeholder: 32-39-39-102
  - type: input
    id: voltages
    attributes:
      label: Voltages (optional)
      description: The memory and memory-controller voltages you set — DDR5 VDD / VDDQ, SoC (AMD) or VDD2 / SA (Intel); DDR4 DRAM and SoC / SA. 이름은 보드 BIOS 에 보이는 그대로 적어 주세요.
      placeholder: VDD 1.35 / VDDQ 1.35 / SoC 1.20
  - type: textarea
    id: changed-settings
    attributes:
      label: Other settings you changed (optional)
      description: Secondary timings, CPU overclock or undervolt, and so on, with the values.
  - type: input
    id: other-tester
    attributes:
      label: Other tester that shows this setting is unstable
      description: Its name. Write "none" if you know it only from crashes in games or work, and describe them below.
    validations:
      required: true
  - type: input
    id: other-tester-minutes
    attributes:
      label: Minutes until that tester showed its first error (optional)
      description: A number of minutes (다른 검사기가 첫 오류를 낸 시간, 분).
      placeholder: "12"
  - type: textarea
    id: unstable-evidence
    attributes:
      label: Other signs it is unstable (optional)
      description: Symptoms in games or work (crashes, freezes, corrupted files), or other testers you ran.
  - type: dropdown
    id: verdict
    attributes:
      label: steadycheck verdict
      description: The `verdict` field of the result JSON. If the PC froze or rebooted there is no verdict.
      options:
        - PASS
        - FAIL
        - INCOMPLETE
        - No verdict (froze, rebooted or blue screen)
    validations:
      required: true
  - type: dropdown
    id: crashed
    attributes:
      label: Did the PC freeze, reboot or blue-screen during the run?
      options:
        - "No"
        - Froze
        - Rebooted
        - Blue screen
    validations:
      required: true
  - type: input
    id: crashed-minute
    attributes:
      label: If it did, at which minute of the run? (optional)
      placeholder: "7"
  - type: input
    id: first-error-ms
    attributes:
      label: Time to the first error — mem.error.at_ms (optional)
      description: "From the result JSON: `mem.error.at_ms`, milliseconds from the start of the memory test (첫 오류까지 밀리초). Use the `mem` command so the CPU stage is not in front. Leave empty on PASS."
      placeholder: "184230"
  - type: input
    id: rounds-d
    attributes:
      label: mem.rounds_d (optional)
      description: "From the result JSON. 4 or more means the memory test ran long enough (메모리 검사 회차, 4 이상이면 충분)."
      placeholder: "9"
  - type: textarea
    id: result-json
    attributes:
      label: Result JSON
      description: Paste the full JSON steadycheck printed (the contents of result.json) if you have it. If the PC froze or rebooted there is no result.json — leave this empty.
      render: json
  - type: dropdown
    id: reverted
    attributes:
      label: With the same setting back at its normal value, did steadycheck PASS? (optional)
      options:
        - Not tried
        - "Yes, PASS"
        - "No, still FAIL"
