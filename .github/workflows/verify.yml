name: verify
on:
  push:
    branches: ['verify-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memflip:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release
      - run: cargo build --release --manifest-path verify/memflip/Cargo.toml
      - name: 바깥에서 메모리 비트 뒤집기 (실행 파일 무수정)
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./target/release/steadycheck.exe).Path
          $flip = (Resolve-Path ./verify/memflip/target/release/memflip.exe).Path
          Write-Host "steadycheck SHA256: $((Get-FileHash $exe).Hash)"
          $rows = @()
          # 대조군 3, 고착 0/1 각 10, 한 번 뒤집기 30 — 비트·위치는 고정 씨앗 무작위
          $null = Get-Random -SetSeed 7
          $plan = foreach ($m in @('watch') * 3 + @('stuck0') * 10 + @('stuck1') * 10 + @('once') * 30) {
            [pscustomobject]@{ mode = $m; bit = Get-Random -Minimum 0 -Maximum 64; word = Get-Random -Minimum 0 -Maximum 67108864 }
          }
          foreach ($t in $plan) {
            $rows += & ./verify/run-memflip.ps1 -Exe $exe -Flip $flip -Mode $t.mode -Bit $t.bit -Word $t.word -DelayMs 2000
          }
          $rows | Format-Table -AutoSize | Out-String | Write-Host
          $rows | Export-Csv memflip.csv -NoTypeInformation
          # 판정: watch 전부 PASS, stuck 전부 caught·bit_ok·방향·header 조건, header 값은 모두 같아야 함, once 는 잡힌 것 전부 위치·비트 일치·1건 이상, 일꾼마다 고착 1건 이상
          $bad = @($rows | Where-Object { -not $_.ok })
          if ($bad.Count) { throw "대조 어긋남 $($bad.Count)건: $(($bad | ForEach-Object { "$($_.mode)/bit$($_.bit)/word$($_.word)" }) -join ', ')" }
          $stuck = @($rows | Where-Object { $_.mode -like 'stuck*' })
          if ($stuck.Count -ne 20) { throw "고착 실행이 20건이 아님: $($stuck.Count)" }
          $headers = @($rows | Where-Object caught | ForEach-Object header | Sort-Object -Unique)
          if ($headers.Count -ne 1) { throw "header 값이 서로 다름: $($headers -join ', ')" }
          $onceCaught = @($rows | Where-Object { $_.mode -eq 'once' -and $_.caught }).Count
          if ($onceCaught -lt 1) { throw "한 번 뒤집기를 하나도 못 잡음" }
          # 일꾼별 잡힌 수: 검사기가 보고한 일꾼 번호(mem.error.thread)
          $perWorker = foreach ($w in 0..3) {
            $in = @($rows | Where-Object { $_.caught -and $_.thread -eq $w })
            [pscustomobject]@{ worker = $w; stuck = @($in | Where-Object { $_.mode -like 'stuck*' }).Count; once = @($in | Where-Object { $_.mode -eq 'once' }).Count }
          }
          $perWorker | Format-Table -AutoSize | Out-String | Write-Host
          $idle = @($perWorker | Where-Object { $_.stuck -eq 0 })
          if ($idle.Count) { throw "잡힌 고착이 없는 일꾼: $($idle.worker -join ', ')" }
          $watchPass = @($rows | Where-Object { $_.mode -eq 'watch' -and $_.verdict -eq 'PASS' }).Count
          Write-Host "header: $($headers[0]) (0x$('{0:x}' -f $headers[0]))"
          Write-Host "고착 20/20, 한 번 뒤집기 $onceCaught/30 잡힘(나머지 덮어써짐), 대조군 $watchPass/3 PASS"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: memflip, path: memflip.csv }
  drfault:
    # 윈도우 x64 DynamoRIO 는 ymm6~15 를 보존하지 않아(검사기 AVX2 정답표부터 깨짐) 리눅스에서 돌린다
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DR_URL: "https://github.com/DynamoRIO/dynamorio/releases/download/release_11.3.0-1/DynamoRIO-Linux-11.3.0.tar.gz"
      DR_SHA256: "ae02049df5c4daeb82d4087aaa0d38bf58cdd26b38fb6042dccf27cbc32ceed9"
      DR_DIR: "DynamoRIO-Linux-11.3.0-1"
    steps:
      - uses: actions/checkout@v5
      - name: DynamoRIO 받기 (해시 확인)
        shell: pwsh
        run: |
          $tgz = "$env:RUNNER_TEMP/dr.tar.gz"
          Invoke-WebRequest $env:DR_URL -OutFile $tgz
          if ((Get-FileHash $tgz -Algorithm SHA256).Hash -ne $env:DR_SHA256.ToUpper()) { throw "DynamoRIO 해시 불일치" }
          tar -xzf $tgz -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "DynamoRIO 풀기 실패" }
      - name: 클라이언트 빌드
        shell: pwsh
        run: |
          cmake -S verify/drfault -B verify/drfault/build -DCMAKE_BUILD_TYPE=Release "-DDynamoRIO_DIR=$env:RUNNER_TEMP/$env:DR_DIR/cmake"
          if ($LASTEXITCODE -ne 0) { throw "cmake 설정 실패" }
          cmake --build verify/drfault/build
          if ($LASTEXITCODE -ne 0) { throw "클라이언트 빌드 실패" }
      - run: cargo build --release
      - run: cargo test --release
      - name: 실행 파일 지문·실제 쓰인 명령 개수
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./target/release/steadycheck).Path
          Write-Host "steadycheck SHA256: $((Get-FileHash $exe).Hash)"
          objdump -d --no-show-raw-insn $exe | Select-String '\s(vfmadd\d{3}[ps][sd]|vpmuludq)\s' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } | Group-Object | Sort-Object Name |
            Format-Table Name, Count -AutoSize | Out-String | Write-Host
          exit 0
      - name: DynamoRIO 만 — AVX2 정답표가 그대로인지 (ymm 보존 확인)
        shell: pwsh
        run: |
          $drrun = "$env:RUNNER_TEMP/$env:DR_DIR/bin64/drrun"
          foreach ($k in 'fma', 'wide') {
            $o = & $drrun -- ./target/release/steadycheck cpu --isa avx2 --kernel $k --threads 4 --iters 4096 --seconds 5 | Out-String
            $j = $o | ConvertFrom-Json
            Write-Host "$k : verdict $($j.verdict) golden_unstable $($j.cpu.golden_unstable) blocks $($j.cpu.blocks) cpu $($j.cpu_brand)"
            if ($j.verdict -ne 'PASS') { $o; throw "DynamoRIO 만으로 $k 가 PASS 아님" }
          }
          exit 0
      - name: 바깥에서 CPU 결과 비트 뒤집기 (실행 파일 무수정, 판정)
        shell: pwsh
        run: |
          $drrun = "$env:RUNNER_TEMP/$env:DR_DIR/bin64/drrun"
          $client = (Resolve-Path ./verify/drfault/build/libdrfault.so).Path
          $exe = (Resolve-Path ./target/release/steadycheck).Path
          # expect: pass0 = PASS·주입 0 / passinj = PASS·주입 ≥1 (왕복만, 0 을 XOR) / fail = FAIL·정답표 정상·주입 ≥1·한 스레드·그 커널
          $plan = @(
            [pscustomobject]@{ name = '대조군'; kernel = 'fma'; ops = 'vfmadd231pd'; every = 0; mask0 = $false; expect = 'pass0' }
            [pscustomobject]@{ name = 'wide 대조군'; kernel = 'wide'; ops = 'vpmuludq'; every = 0; mask0 = $false; expect = 'pass0' }
            [pscustomobject]@{ name = '문맥 왕복 대조'; kernel = 'fma'; ops = 'vfmadd231pd'; every = 1000; mask0 = $true; expect = 'passinj' }
            [pscustomobject]@{ name = 'FMA 일꾼'; kernel = 'fma'; ops = 'vfmadd231pd'; every = 1000; mask0 = $false; expect = 'fail' }
            [pscustomobject]@{ name = '정수 곱셈 일꾼'; kernel = 'wide'; ops = 'vpmuludq'; every = 1000; mask0 = $false; expect = 'fail' }
            [pscustomobject]@{ name = 'FMA 드물게'; kernel = 'fma'; ops = 'vfmadd231pd'; every = 100000; mask0 = $false; expect = 'fail' }
          )
          $rows = foreach ($t in $plan) {
            $r = & ./verify/run-drfault.ps1 -Drrun $drrun -Client $client -Exe $exe -Kernel $t.kernel -Ops $t.ops -Every $t.every -Bit 20 -Thread worker -Mask0:$t.mask0
            $ok = switch ($t.expect) {
              'pass0' { $r.verdict -eq 'PASS' -and $r.injections -eq 0 }
              'passinj' { $r.verdict -eq 'PASS' -and $r.injections -ge 1 -and $r.inj_threads -eq 1 }
              'fail' { $r.verdict -eq 'FAIL' -and -not $r.golden_unstable -and $r.injections -ge 1 -and $r.inj_threads -eq 1 -and $r.err_kernel -eq $t.kernel }
            }
            $r | Add-Member -NotePropertyName name -NotePropertyValue $t.name -PassThru |
              Add-Member -NotePropertyName ops -NotePropertyValue $t.ops -PassThru |
              Add-Member -NotePropertyName cpu_check -NotePropertyValue '리눅스에서 확인 불가' -PassThru |
              Add-Member -NotePropertyName ok -NotePropertyValue ([bool]$ok) -PassThru
          }
          $rows | Format-Table name, kernel, ops, every, verdict, injections, inj_threads, inj_tid, err_kernel, cpu_check, inj_worker, err_worker, worker_same, detect_ms, ok -AutoSize | Out-String -Width 300 | Write-Host
          $rows | Export-Csv drfault.csv -NoTypeInformation
          $bad = @($rows | Where-Object { -not $_.ok })
          if ($bad.Count) { throw "대조 어긋남: $(($bad | ForEach-Object name) -join ', ')" }
          exit 0
      - name: 정답 만드는 스레드 불량 실험 (E3, 기록만)
        shell: pwsh
        run: |
          $drrun = "$env:RUNNER_TEMP/$env:DR_DIR/bin64/drrun"
          $client = (Resolve-Path ./verify/drfault/build/libdrfault.so).Path
          $exe = (Resolve-Path ./target/release/steadycheck).Path
          $plan = @(
            [pscustomobject]@{ name = '주 스레드 한 번'; every = 50000; match = -1; thread = 'main' }
            [pscustomobject]@{ name = '주 스레드 일관'; every = 0; match = 1365; thread = 'main' }
            [pscustomobject]@{ name = '주 스레드 일관 + 일꾼 1개'; every = 0; match = 1365; thread = 'main+worker' }
          )
          # 결과를 바꾸려 하지 않는다: PASS 면 경고만, 실행이 안 될 때만 실패
          $rows = foreach ($t in $plan) {
            $r = & ./verify/run-drfault.ps1 -Drrun $drrun -Client $client -Exe $exe -Kernel fma -Ops vfmadd231pd -Every $t.every -Match $t.match -Bit 20 -Thread $t.thread
            if ($r.verdict -eq 'PASS') { Write-Host "::warning::설계 약점 후보: $($t.name) 가 PASS (주입 $($r.injections))" }
            $r | Add-Member -NotePropertyName name -NotePropertyValue $t.name -PassThru |
              Add-Member -NotePropertyName thread -NotePropertyValue $t.thread -PassThru
          }
          $rows | Format-Table name, thread, every, verdict, golden_unstable, injections, inj_main, inj_threads, err_worker, err_kernel, err_block -AutoSize | Out-String -Width 300 | Write-Host
          $rows | Export-Csv drfault-e3.csv -NoTypeInformation
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: drfault, path: "drfault*.csv" }
