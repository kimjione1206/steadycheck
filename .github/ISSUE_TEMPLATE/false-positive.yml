name: Result on a PC I believe is stable
description: You ran steadycheck on a PC you have good reason to think is stable. PASS, FAIL and INCOMPLETE are all wanted — PASS results show how often it stays quiet.
title: "[stable PC] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. How to run and what to paste: [testing guide](https://github.com/kimjione1206/steadycheck/blob/main/docs/TESTING.md) ([한국어](https://github.com/kimjione1206/steadycheck/blob/main/docs/TESTING.ko.md)).
        **A PASS is worth reporting too:** it is the only way to know how often steadycheck raises a false alarm (PASS 결과도 꼭 필요합니다).
        **Do not paste personal data:** no serial numbers, names, user or computer names, IP addresses or product keys. `tools/collect-info.ps1` leaves these out, and the steadycheck result JSON contains no personal data.
  - type: input
    id: version
    attributes:
      label: steadycheck version
      description: The `version` field of the result JSON, e.g. 0.6.0.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: steadycheck mem --mb auto --seconds 600 --require-complete --keep-going 20
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Paste the output of `tools/collect-info.ps1`.
    validations:
      required: true
  - type: dropdown
    id: memory-type
    attributes:
      label: Memory type
      description: The "Memory type" line printed by `tools/collect-info.ps1`. LPDDR4, LPDDR5 and DDR3 count as Other.
      options:
        - DDR4
        - DDR5
        - Other
        - Don't know
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: steadycheck verdict
      description: The `verdict` field of the result JSON. If the PC froze or rebooted there is no verdict.
      options:
        - PASS
        - FAIL
        - INCOMPLETE
        - No verdict (froze, rebooted or blue screen)
    validations:
      required: true
  - type: dropdown
    id: crashed
    attributes:
      label: Did the PC freeze, reboot or blue-screen during the run?
      options:
        - "No"
        - Froze
        - Rebooted
        - Blue screen
    validations:
      required: true
  - type: input
    id: crashed-minute
    attributes:
      label: If it did, at which minute of the run? (optional)
      placeholder: "7"
  - type: textarea
    id: stable-evidence
    attributes:
      label: Why you believe this PC is stable
      description: Which tests you ran and for how long (the tester you normally use and the hours it ran without errors), whether CPU and memory settings are at their defaults, how long the PC has run daily work without problems.
    validations:
      required: true
  - type: textarea
    id: result-json
    attributes:
      label: Result JSON
      description: Paste the full JSON steadycheck printed (the contents of result.json) if you have it. If the PC froze or rebooted there is no result.json — leave this empty.
      render: json
  - type: textarea
    id: other-programs
    attributes:
      label: Were other programs running during the test?
      description: List them (browser, games, virus scan, updates, other stress tests) or write "none".
    validations:
      required: true
