name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

env:
  SDE_URL: "https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-win.tar.xz"
  SDE_SHA256: "74e626ede09b0baa5011fc9e51b58627ea92c3fc0bae5fd7db34b490f335f651"
  SDE_DIR: "sde-external-10.13.1-2026-07-28-win"

jobs:
  windows:
    # 같은 작업을 4번 돌려 서로 다른 CPU 기종 표본을 얻는다
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustc --version
      - run: cargo test --release -- --nocapture
      - name: 고장 모형 시뮬레이터 표 (시험을 하나씩 차례로 — 표가 섞이지 않게)
        if: matrix.sample == 1
        run: cargo test --release --test march_coverage -- --nocapture --test-threads 1
      - name: 실제 실행 (CPU 기종·명령어 세트 기록)
        shell: pwsh
        run: |
          cargo build --release
          $out = ./target/release/steadycheck.exe cpu --seconds 30 | Out-String
          if ($LASTEXITCODE -ne 0) { $out; exit 1 }
          $out
          $j = $out | ConvertFrom-Json
          Write-Host "cpu_brand: $($j.cpu_brand) / isa: $($j.cpu.isa)"
          # GitHub x86 러너는 모두 AVX2 지원 — avx2/avx512 가 아니면(값 없음 포함) 감지가 고장난 것
          if ($j.cpu.isa -notin 'avx2','avx512') { throw "isa 가 avx2/avx512 아님($($j.cpu.isa)): AVX2 감지 실패" }
          # 메모리: 일꾼 1명 대 전부 — 동시에 두드려야 전송량이 올라간다
          $m1 = ./target/release/steadycheck.exe mem --mb 4096 --seconds 15 --threads 1 | Out-String
          if ($LASTEXITCODE -ne 0) { $m1; throw "mem 일꾼 1명 실행이 PASS 아님" }
          $mall = ./target/release/steadycheck.exe mem --mb 4096 --seconds 15 | Out-String
          if ($LASTEXITCODE -ne 0) { $mall; throw "mem 일꾼 전부 실행이 PASS 아님" }
          $a = ($m1 | ConvertFrom-Json).mem; $b = ($mall | ConvertFrom-Json).mem
          $ratio = [math]::Round([double]$b.verified_bytes_per_sec / [math]::Max([double]1, [double]$a.verified_bytes_per_sec), 2)
          Write-Host "mem: 일꾼1 $($a.verified_bytes_per_sec) B/s, 일꾼$($b.threads) $($b.verified_bytes_per_sec) B/s, 배수 $ratio, 최소 패스 $($b.min_thread_passes)"
          if ($b.min_thread_passes -lt 1) { throw "mem: 패스를 못 끝낸 일꾼이 있음" }
          if ($ratio -lt 1.0) { throw "mem: 일꾼 전부가 1명보다 느림 ($ratio)" }
          # 메모리 60초: 서버 검사는 시간을 충분히 주므로 기본 세트를 못 끝내면 실패
          $o = ./target/release/steadycheck.exe mem --mb 4096 --seconds 60 | Out-String
          if ($LASTEXITCODE -ne 0) { $o; throw "mem 60초 실행이 PASS 아님" }
          $c = ($o | ConvertFrom-Json).mem
          Write-Host "mem 60s: base_complete=$($c.base_complete) base_seconds_estimate=$($c.base_seconds_estimate) verified_bytes_per_sec=$($c.verified_bytes_per_sec) rounds_d=$($c.rounds_d) bursts_e=$($c.bursts_e) elapsed_ms=$($c.elapsed_ms) threads=$($c.threads)"
          if ($c.base_complete -ne $true) { $o; throw "mem 60초: 기본 세트를 못 끝냄" }
          # --mb auto: 사용 가능한 메모리로 잡은 크기와 결과
          $o = ./target/release/steadycheck.exe mem --mb auto --seconds 30 | Out-String
          if ($LASTEXITCODE -ne 0) { $o; throw "mem --mb auto 실행이 PASS 아님" }
          $j = $o | ConvertFrom-Json; $c = $j.mem
          Write-Host "mem auto: $($c.bytes / 1MB) MiB, verdict=$($j.verdict) warnings=$($j.warnings -join ',') base_complete=$($c.base_complete) base_seconds_estimate=$($c.base_seconds_estimate) verified_bytes_per_sec=$($c.verified_bytes_per_sec) rounds_d=$($c.rounds_d) bursts_e=$($c.bursts_e)"
      - name: 커널별 부하량 (초당 줄×반복, 평균 블록 시간)
        shell: pwsh
        run: |
          $rows = @()
          foreach ($k in 'chain','wide','fma','fma32','lz') {
            $o = ./target/release/steadycheck.exe cpu --kernel $k --seconds 15 | Out-String
            if ($LASTEXITCODE -ne 0) { $o; throw "$k 실행이 PASS 아님" }
            $j = $o | ConvertFrom-Json
            $blockMs = [math]::Round($j.cpu.run_ms * $j.cpu.threads / [math]::Max([double]1, [double]$j.cpu.blocks), 1)
            $rows += [pscustomobject]@{ kernel = $k; isa = $j.cpu.isa; lane_iters_per_sec = $j.cpu.lane_iters_per_sec; avg_block_ms = $blockMs }
            # 1초 안 검출 여유: 기본 반복 수에서 블록이 500ms 를 넘으면 실패
            if ($blockMs -ge 500) { throw "$k 평균 블록 ${blockMs}ms — 기본 반복 수가 너무 큼" }
          }
          $chain = ($rows | Where-Object kernel -eq 'chain').lane_iters_per_sec
          foreach ($r in $rows) { $r | Add-Member -NotePropertyName ratio_vs_chain -NotePropertyValue ([math]::Round($r.lane_iters_per_sec / [math]::Max([double]1, [double]$chain), 2)) }
          Write-Host "cpu_brand: $((./target/release/steadycheck.exe cpu --seconds 1 --kernel chain --iters 4096 | Out-String | ConvertFrom-Json).cpu_brand)"
          $rows | Format-Table -AutoSize | Out-String | Write-Host
          $o = ./target/release/steadycheck.exe cpu --pattern pulse --seconds 10 | Out-String
          if ($LASTEXITCODE -ne 0) { $o; throw "pulse 실행이 PASS 아님" }
          # 코어 순환: 가벼운 부하로 한 코어씩 — 모든 코어가 한 블록 이상 돌아야 PASS
          $o = ./target/release/steadycheck.exe cpu --pattern cycle --kernel chain --isa scalar --seconds 20 | Out-String
          if ($LASTEXITCODE -ne 0) { $o; throw "cycle 실행이 PASS 아님" }
          $c = ($o | ConvertFrom-Json).cpu
          Write-Host "cycle: threads=$($c.threads) min_thread_blocks=$($c.min_thread_blocks) blocks=$($c.blocks)"
          if ($c.min_thread_blocks -lt 1) { throw "cycle: 검사 못 한 코어가 있음" }
          # lz 스칼라 경로(빠른 경로 없음)의 평균 블록 시간
          $o = ./target/release/steadycheck.exe cpu --kernel lz --isa scalar --seconds 15 | Out-String
          if ($LASTEXITCODE -ne 0) { $o; throw "lz 스칼라 실행이 PASS 아님" }
          $c = ($o | ConvertFrom-Json).cpu
          $blockMs = [math]::Round($c.run_ms * $c.threads / [math]::Max([double]1, [double]$c.blocks), 1)
          Write-Host "lz scalar: avg_block_ms=$blockMs lane_iters_per_sec=$($c.lane_iters_per_sec)"
          if ($blockMs -ge 500) { throw "lz 스칼라 평균 블록 ${blockMs}ms — 기본 반복 수가 너무 큼" }
          # 코어끼리 주고받기: 모든 일꾼이 한 통 이상 받아야 PASS
          $o = ./target/release/steadycheck.exe share --seconds 15 | Out-String
          if ($LASTEXITCODE -ne 0) { $o; throw "share 실행이 PASS 아님" }
          $s = ($o | ConvertFrom-Json).share
          Write-Host "share: threads=$($s.threads) pinned=$($s.pinned) min_thread_messages=$($s.min_thread_messages) messages_per_sec=$($s.messages_per_sec)"
          if ($s.min_thread_messages -lt 1) { throw "share: 한 통도 못 받은 일꾼이 있음" }
          # 주입한 옛 값 읽기를 잡아야 한다
          $o = ./target/release/steadycheck.exe share --seconds 10 --inject-share 1:100 | Out-String
          if ($LASTEXITCODE -ne 1) { $o; throw "share 주입을 못 잡음: $LASTEXITCODE" }
          # 실패 원인이 주입한 일꾼 1의 옛 값 읽기인지
          $e = ($o | ConvertFrom-Json).share.error
          Write-Host "share 주입 오류: cpu=$($e.cpu) from=$($e.from) seq=$($e.seq) word=$($e.word)"
          if ($null -eq $e -or $e.cpu -ne 1) { $o; throw "share 주입 오류가 일꾼 1 이 아님" }
          exit 0
      - name: 하드웨어 정보 스크립트 (필수 항목, 개인정보 값 없음)
        shell: pwsh
        run: |
          # 사용자처럼 실행 파일 옆에 두고, 윈도우 기본 PowerShell 5.1 과 7 둘 다로 돌린다
          Copy-Item tools/collect-info.ps1 target/release/
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          # 출력에 나오면 안 되는 값: 일련번호(메인보드·BIOS·메모리·윈도우), 등록 사용자, 기기 고유 번호(UUID), 컴퓨터 이름, 사용자 이름. 값 자체는 로그에 찍지 않는다
          $osInfo = Get-CimInstance Win32_OperatingSystem
          $osIds = [ordered]@{ '윈도우 일련번호' = $osInfo.SerialNumber; '등록 사용자' = $osInfo.RegisteredUser; 'UUID' = (Get-CimInstance Win32_ComputerSystemProduct).UUID }
          $forbidden = @(Get-CimInstance Win32_BaseBoard | ForEach-Object SerialNumber) +
            @(Get-CimInstance Win32_BIOS | ForEach-Object SerialNumber) +
            @(Get-CimInstance Win32_PhysicalMemory | ForEach-Object SerialNumber) +
            @($osIds.Values) + @($env:COMPUTERNAME, $env:USERNAME)
          # 빈 값과 "None" 같은 자리 채움 값은 다른 칸(부품 번호 등)에 우연히 나올 수 있어 뺀다
          $forbidden = @($forbidden | ForEach-Object { "$_".Trim() } | Where-Object { $_.Length -ge 5 -and $_ -notin 'Default string', 'To be filled by O.E.M.', 'Not Specified', 'Unknown' } | Sort-Object -Unique)
          if (-not ($forbidden -contains $env:COMPUTERNAME.Trim() -and $forbidden -contains $env:USERNAME.Trim())) { throw "컴퓨터·사용자 이름이 확인 목록에 없음" }
          # 윈도우 일련번호·등록 사용자·UUID 도 이 서버에서 값이 있어야 "출력에 없음"이 의미가 있다
          # 값 대신 길이만 찍는다
          $absent = @($osIds.Keys | Where-Object { $v = "$($osIds[$_])".Trim(); Write-Host "${_}: 길이 $($v.Length)"; $forbidden -notcontains $v })
          if ($absent.Count) { throw "확인 목록에 없음: $($absent -join ', ')" }
          $required = '| Windows |', '| CPU |', '| Cores / threads |', '| Motherboard |', '| BIOS |', '| Memory total |', "| steadycheck | $ver (steadycheck.exe) |",
            '| Module | Manufacturer | Part number | Capacity | Rated speed | Configured speed |'
          foreach ($sh in 'powershell', 'pwsh') {
            $out = & $sh -NoProfile -ExecutionPolicy Bypass -File target/release/collect-info.ps1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "${sh}: 스크립트 종료 코드 $LASTEXITCODE" }
            $leak = @($forbidden | Where-Object { $out.IndexOf($_, [StringComparison]::OrdinalIgnoreCase) -ge 0 }).Count
            if ($leak) { throw "${sh}: 출력에 개인정보 값 $leak 개가 있음" }
            $missing = @($required | Where-Object { -not $out.Contains($_) })
            if ($missing.Count) { $out; throw "${sh}: 필수 항목 없음: $($missing -join ', ')" }
            Write-Host "--- $sh (개인정보 값 $($forbidden.Count)개 확인, 출력에 없음) ---"
            Write-Host $out
          }

  avx512-sde:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release
      - name: SDE 받기
        shell: pwsh
        run: |
          Invoke-WebRequest $env:SDE_URL -OutFile sde.tar.xz
          if ((Get-FileHash sde.tar.xz -Algorithm SHA256).Hash -ne $env:SDE_SHA256.ToUpper()) { throw "SDE 해시 불일치" }
          # 윈도우 tar 는 .xz 를 못 풀 수 있어 7-Zip 으로 두 번 푼다
          7z x sde.tar.xz -y
          if ($LASTEXITCODE -ne 0) { throw "sde.tar.xz 풀기 실패" }
          7z x sde.tar -y
          if ($LASTEXITCODE -ne 0) { throw "sde.tar 풀기 실패" }
      - name: AVX-512 경로가 정답표와 같은지 (흉내 CPU)
        shell: pwsh
        run: |
          $sde = "./$env:SDE_DIR/sde.exe"
          foreach ($k in 'chain','wide','fma','fma32','lz') {
            & $sde -spr -- ./target/release/steadycheck.exe cpu --isa avx512 --kernel $k --seconds 10 --threads 2 --iters 65536
            if ($LASTEXITCODE -ne 0) { throw "$k AVX-512 정상 실행이 PASS 가 아님: $LASTEXITCODE" }
            & $sde -spr -- ./target/release/steadycheck.exe cpu --isa avx512 --kernel $k --seconds 10 --threads 2 --iters 65536 --inject-cpu 1:3
            if ($LASTEXITCODE -ne 1) { throw "$k AVX-512 주입을 못 잡음: $LASTEXITCODE" }
          }
          exit 0
      - name: 자동 선택(번갈아 쓰기) 흉내 CPU 확인
        shell: pwsh
        run: |
          $sde = "./$env:SDE_DIR/sde.exe"
          # --isa 없이 돌려 AVX-512 ↔ AVX2 번갈아 쓰기가 켜지는지
          $o = & $sde -spr -- ./target/release/steadycheck.exe cpu --kernel chain --seconds 10 --threads 2 --iters 65536 | Out-String
          if ($LASTEXITCODE -ne 0) { $o; throw "자동 선택 정상 실행이 PASS 아님: $LASTEXITCODE" }
          $j = $o | ConvertFrom-Json
          Write-Host "isa: $($j.cpu.isa) / rotate_isa: $($j.cpu.rotate_isa)"
          if ($j.cpu.isa -ne 'avx512' -or $j.cpu.rotate_isa -ne $true) { throw "번갈아 쓰기가 켜지지 않음" }
          # 커널 하나면 블록 1 은 AVX2 차례
          $o = & $sde -spr -- ./target/release/steadycheck.exe cpu --kernel chain --seconds 10 --threads 2 --iters 65536 --inject-cpu 0:1 | Out-String
          if ($LASTEXITCODE -ne 1) { $o; throw "자동 선택 주입을 못 잡음: $LASTEXITCODE" }
          $j = $o | ConvertFrom-Json
          Write-Host "주입 오류 isa: $($j.cpu.error.isa)"
          if ($j.cpu.error.isa -ne 'avx2') { throw "블록 1 오류가 AVX2 경로가 아님($($j.cpu.error.isa))" }
          exit 0
      - name: AVX-512 단위·채점표 시험 (흉내 CPU)
        shell: pwsh
        run: |
          $sde = "./$env:SDE_DIR/sde.exe"
          # 시험 실행 파일 경로를 cargo JSON 출력에서 찾는다
          $arts = cargo test --release --no-run --message-format=json |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -eq $true -and $_.executable }
          if ($LASTEXITCODE -ne 0) { throw "시험 빌드 실패" }
          $lib = @($arts | Where-Object { $_.target.kind -contains 'lib' })[0].executable
          $detect = @($arts | Where-Object { $_.target.name -eq 'detect' })[0].executable
          $fm = @($arts | Where-Object { $_.target.name -eq 'fault_models' })[0].executable
          if (-not $lib -or -not $detect -or -not $fm) { throw "시험 실행 파일을 못 찾음" }
          & $sde -spr -- $lib simd_matches_scalar --nocapture
          if ($LASTEXITCODE -ne 0) { throw "simd_matches_scalar 실패: $LASTEXITCODE" }
          $env:DETECT_ISA = 'avx512'
          $out = & $sde -spr -- $detect cpu_catches_every_injected_flip --nocapture 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "cpu_catches_every_injected_flip 실패: $code" }
          # AVX-512 를 조용히 건너뛰었으면 실패
          foreach ($k in 'Chain','Wide','Fma','Fma32','Lz') {
            if ($out -notmatch "$k/Avx512: 200/200") { throw "$k AVX-512 채점표가 돌지 않음" }
          }
          # 불량 모델 시험도 흉내 CPU 에서
          $out = & $sde -spr -- $fm --nocapture 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "fault_models 실패: $code" }
          if ($out -notmatch "M1 FMA 입력 지수 조건: 잡힘") { throw "M1 줄이 없음" }
          if ($out -notmatch "M4 한두 코어일 때만: 4스레드 동시 안 잡힘, 코어 순환 잡힘") { throw "M4 줄이 없음" }
          if ($out -notmatch "M5 깨어난 직후만: steady 안 잡힘, pulse·코어 순환 잡힘") { throw "M5 줄이 없음" }
          if ($out -notmatch "M6 바이트 이웃 저장: lz·mix 잡힘, chain 안 잡힘") { throw "M6 줄이 없음" }
          if ($out -notmatch "M7 옛 값 읽기: share 잡힘") { throw "M7 줄이 없음" }
          exit 0
