name: Tested a part known to be faulty
description: You ran steadycheck with a memory module or CPU that is known to be faulty (another tester shows errors, or replacing it fixed the problem). PASS, FAIL and INCOMPLETE all help.
title: "[known-faulty part] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. How to run and what to paste: [testing guide](https://github.com/kimjione1206/steadycheck/blob/main/docs/TESTING.md) ([한국어](https://github.com/kimjione1206/steadycheck/blob/main/docs/TESTING.ko.md)).
        **Do not paste personal data:** no serial numbers, names, user or computer names, IP addresses or product keys. `tools/collect-info.ps1` leaves these out, and the steadycheck result JSON contains no personal data.
  - type: input
    id: version
    attributes:
      label: steadycheck version
      description: The `version` field of the result JSON, e.g. 0.6.0.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: steadycheck mem --mb auto --seconds 600 --require-complete --keep-going 20
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Faulty part
      options:
        - Memory module
        - CPU
        - Other
    validations:
      required: true
  - type: textarea
    id: faulty-evidence
    attributes:
      label: How you know it is faulty
      description: Which other tester you used and what it showed (number of errors, minutes to the first error), or that replacing the part fixed the problem.
    validations:
      required: true
  - type: dropdown
    id: memory-type
    attributes:
      label: Memory type
      description: The "Memory type" line printed by `tools/collect-info.ps1`. LPDDR4, LPDDR5 and DDR3 count as Other.
      options:
        - DDR4
        - DDR5
        - Other
        - Don't know
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: steadycheck verdict
      description: The `verdict` field of the result JSON. If the PC froze or rebooted there is no verdict.
      options:
        - PASS
        - FAIL
        - INCOMPLETE
        - No verdict (froze, rebooted or blue screen)
    validations:
      required: true
  - type: dropdown
    id: crashed
    attributes:
      label: Did the PC freeze, reboot or blue-screen during the run?
      options:
        - "No"
        - Froze
        - Rebooted
        - Blue screen
    validations:
      required: true
  - type: input
    id: crashed-minute
    attributes:
      label: If it did, at which minute of the run? (optional)
      placeholder: "7"
  - type: input
    id: first-error-ms
    attributes:
      label: Time to the first error (ms)
      description: "From the result JSON: `mem.error.at_ms` for memory (milliseconds from the start of the memory test, 첫 오류까지 밀리초), `cpu.error.at_ms` for a CPU. Leave empty on PASS."
      placeholder: "184230"
  - type: textarea
    id: result-json
    attributes:
      label: Result JSON
      description: Paste the full JSON steadycheck printed (the contents of result.json) if you have it. If the PC froze or rebooted there is no result.json — leave this empty.
      render: json
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Paste the output of `tools/collect-info.ps1`.
    validations:
      required: true
  - type: textarea
    id: changed-settings
    attributes:
      label: Settings changed from default (optional)
      description: Leave empty if everything is at its default (stock).
