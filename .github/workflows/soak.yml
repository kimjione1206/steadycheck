name: soak
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "CPU·RAM 각각 몇 분(CPU 다음 RAM 이 각각 이만큼 돌아 합계 2배 — 최대 170)"
        default: "60"
permissions:
  contents: read
jobs:
  soak:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release
      - name: 장시간 실행 — 오류가 하나라도 나면 실패
        shell: pwsh
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          $s = [int]$env:MINUTES * 60
          ./target/release/steadycheck.exe all --seconds $s --mb 8192
          if ($LASTEXITCODE -ne 0) { exit 1 }
